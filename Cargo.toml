[package]
name = "ai-token-timeline"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Local agent usage, cost and delivery observability"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
unicode-width = "0.2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
